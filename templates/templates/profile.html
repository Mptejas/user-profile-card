<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
            margin: auto;
            margin-top: 50px;
            border-radius: 10px;
        }

        img {
            width: 100px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="{{ image }}" alt="Profile Image">
    <h2>{{ name }}</h2>
    <p>{{ bio }}</p>
</div>

</body>
</html>
